<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACVERSE Mini App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="top-bar">
        <div class="logo">ACVERSE</div>
        <div class="header-badges">
            <div class="pill-btn">🎧 AUDIO</div>
            <div class="pill-btn yellow-btn"><span id="headerUnlockedCount">0</span> UNLOCKED</div>
        </div>
    </div>

    <!-- TAB 1: HOME VIEW -->
    <div id="view-home" class="tab-view active-view">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search romantic, thriller, action..." oninput="filterStories()">
        </div>

        <div class="categories-card">
            <h3>CATEGORIES</h3>
            <div class="tags-group">
                <button class="tag active" onclick="filterCat('All', event)">All</button>
                <button class="tag" onclick="filterCat('Pocket FM', event)">Pocket FM</button>
                <button class="tag" onclick="filterCat('Pratilipi FM', event)">Pratilipi FM</button>
            </div>
        </div>

        <div class="stories-grid" id="storiesGrid"></div>
    </div>

    <!-- TAB 2: EXPLORE VIEW -->
    <div id="view-explore" class="tab-view hidden">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="exploreInput" placeholder="Explore catalog..." oninput="filterStoriesExplore()">
        </div>
        <div class="stories-grid" id="exploreGrid"></div>
    </div>

    <!-- TAB 3: ORDERS VIEW -->
    <div id="view-orders" class="tab-view hidden">
        <div class="user-card">
            <h3>📦 Unlocked Stories</h3>
            <p style="font-size: 11px; color: #777; margin-bottom: 12px;">Your purchased content library</p>
            <div id="unlockedList"></div>
        </div>
    </div>

    <!-- TAB 4: PROFILE VIEW -->
    <div id="view-profile" class="tab-view hidden">
        <div class="user-card">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div>
                    <h3 id="userName">User</h3>
                    <span class="badge-orange" id="userId">ID: 000000</span>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <h2 id="unlockedCount">0</h2>
                    <p>UNLOCKED</p>
                </div>
                <div class="stat-box">
                    <h2 id="totalShows">0</h2>
                    <p>TOTAL SHOWS</p>
                </div>
            </div>

            <div class="theme-section">
                <p>APPEARANCE</p>
                <div class="theme-buttons">
                    <button class="theme-btn active-theme" onclick="setTheme('', event)">Light</button>
                    <button class="theme-btn" onclick="setTheme('dark-theme', event)">Dark</button>
                    <button class="theme-btn" onclick="setTheme('cyber-theme', event)">Cyber</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home', event)">
            <span>🏠</span>
            HOME
        </button>
        <button class="nav-btn" onclick="switchTab('explore', event)">
            <span>🧩</span>
            EXPLORE
        </button>
        <button class="nav-btn" onclick="switchTab('orders', event)">
            <span>📦</span>
            ORDERS
        </button>
        <button class="nav-btn" onclick="switchTab('profile', event)">
            <span>👤</span>
            PROFILE
        </button>
    </nav>

    <!-- STORY MODAL -->
    <div id="storyModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalContainer"></div>
        </div>
    </div>

    <!-- PAYMENT MODAL -->
    <div id="paymentModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closePaymentModal()">✕</button>
            <div class="upi-pay-box">
                <h3>PAYMENT DETAILS</h3>
                <p style="font-size: 12px; margin-top: 4px;">Amount: <b>₹<span id="payAmountVal">0</span></b></p>
                
                <div class="qr-frame">
                    <img id="paymentQr" src="" alt="UPI QR">
                </div>

                <div class="upi-copy-row" onclick="copyUpi()">
                    <span id="upiIdText">upi@id</span>
                    <span>📋 COPY</span>
                </div>

                <input type="text" id="utrInput" placeholder="Enter 12 Digit UTR Number" style="width:100%; padding:10px; border:2px solid var(--border); border-radius:8px; font-weight:700; margin-bottom:10px; text-align:center;">
                <button class="btn-buy" style="width:100%;" onclick="submitTransaction()">SUBMIT PAYMENT</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
